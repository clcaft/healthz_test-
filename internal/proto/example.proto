syntax = "proto3";

package token;

option go_package = "gl.eda1.ru;proto";
option php_namespace = "application\\modules\\example\\components\\exampleService\\gen";
option php_metadata_namespace = "application\\modules\\example\\components\\exampleService\\gen";

service Example {
  rpc Plus (ExampleRequest) returns (ExampleResponse);
}

message ExampleRequest {
  int64 counter_id = 1;
  int64 value = 2;

}

message ExampleResponse {
  int64 new_value = 1;
}